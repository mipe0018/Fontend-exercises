<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Curse Word Filter</title>
</head>

<body>

    <div class="info">

        <!-- Overskrift -->
        <h1>Curse Word Filter</h1>

        <!-- Teksten der skal ændres -->
        <p class="text">
            Programmering er sjovt! Men husk altid at bruge
            var, float og marquee i moderne kodning.
        </p>

        <!-- Knappen -->
        <button class="skift">
            Skift ord
        </button>

    </div>


    <!-- Dialogboks -->
    <dialog class="dialog">

        <div class="dialog-content">

            <h2>Teksten er allerede opdateret</h2>

            <p>
                Alle de dårlige ord er allerede blevet skiftet
                ud med de gode ord.
            </p>

            <button class="luk">
                Luk
            </button>

        </div>

    </dialog>


    <script src="main.js"></script>

</body>

</html>
