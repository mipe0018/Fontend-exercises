<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Exercise</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>

<body>

<div class="buttons">
  <button data-filter="all">Vis alle Fartøjer</button>
  <button data-filter="electric">El-drevne</button>
  <button data-filter="moreThanTwoSeats">Med mere end 2 sæder</button>
  <button data-filter="electricOwnedByJonas">Ejet af Jonas + el-drevne</button>
  <button data-filter="ryebreadMoreThanOne">Med mere end 1 sæde og benytter Rugbrød som brændstof</button>
</div>

<table>
  <thead>
    <tr>
      <th>Type</th>
      <th>Brændstof</th>
      <th>Passagerer</th>
      <th>Stop</th>
      <th>Ejer</th>
      <th>El</th>
      <th>Tandem</th>
    </tr>
  </thead>

  <tbody></tbody>
</table>
</body>

</html>
